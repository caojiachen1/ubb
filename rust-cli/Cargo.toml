[package]
name = "ubb"
version = "1.0.0"
edition = "2021"
description = "UBB Rust fallback CLI + daemon (protocol-compatible with daemon/ubb-bridge.mjs)"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process"] }
tokio-tungstenite = "0.24"
tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
strip = true
